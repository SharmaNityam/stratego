apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../grafana.yaml
  - ../prometheus.yaml
  - ../node-exporter.yaml
  - alertmanager.yaml
patches:
  - path: prometheus-alertmanager-patch.yaml
  - target:
      kind: Deployment
      name: grafana
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: GF_SECURITY_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: stratego-grafana-admin
                key: password
