apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - ingress.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: stratego
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: stratego
      spec:
        template:
          spec:
            containers:
              - name: stratego
                env:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: stratego-postgres-main-ha-app
                        key: uri
