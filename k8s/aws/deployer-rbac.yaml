apiVersion: v1
kind: ServiceAccount
metadata:
  name: stratego-deployer
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: stratego-deployer
  namespace: default
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [stratego]
    verbs: [get, list, watch, patch]
  - apiGroups: ['']
    resources: [services]
    resourceNames: [stratego]
    verbs: [get, patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    resourceNames: [stratego]
    verbs: [get, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    resourceNames: [stratego]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: stratego-deployer
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: stratego-deployer
subjects:
  - kind: ServiceAccount
    name: stratego-deployer
    namespace: default
---
apiVersion: v1
kind: Secret
metadata:
  name: stratego-deployer-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: stratego-deployer
type: kubernetes.io/service-account-token
