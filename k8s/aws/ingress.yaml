apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stratego
  annotations:
    nginx.org/ssl-redirect: 'false'
    nginx.org/redirect-to-https: 'false'
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stratego
                port:
                  number: 80
