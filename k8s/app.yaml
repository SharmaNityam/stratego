apiVersion: apps/v1
kind: Deployment
metadata:
  name: stratego
spec:
  replicas: 2
  selector:
    matchLabels: {app: stratego}
  template:
    metadata:
      labels: {app: stratego}
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '5000'
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: {app: stratego}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: stratego
          image: stratego-app:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: stratego-db, key: url}
          ports:
            - containerPort: 5000
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 5000}
          livenessProbe:
            httpGet: {path: /healthz, port: 5000}
---
apiVersion: v1
kind: Service
metadata:
  name: stratego
spec:
  type: NodePort
  selector: {app: stratego}
  ports:
    - {port: 80, targetPort: 5000, nodePort: 30080}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stratego
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: stratego}
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
