name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stratego
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: stratego
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stratego -d stratego"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql://stratego:localtest@localhost:5432/stratego
      - run: docker build -t stratego-app:ci .
